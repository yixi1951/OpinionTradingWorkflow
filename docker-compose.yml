# OpinionTrading compose
#
# Preferred Next.js UI + API (profile "web"):
#   docker compose --profile web up --build api web
#   → Dashboard http://localhost:3000  API http://localhost:8000
#   (Do not run Grafana on :3000 at the same time — use full stack OR profile web.)
#
# Legacy Streamlit UI (no API / collector / Prometheus):
#   docker compose --profile ui up --build streamlit-ui
#   → http://localhost:8501
#   mounts ./data (rw) and ./config (ro). Keyword scoring by default (CI-safe).
#
# Full microservices stack:
#   docker compose up -d --build
#   API:         http://localhost:8000/v1/status
#   Collector:   http://localhost:8001
#   Inference:   http://localhost:8002
#   Compute:     http://localhost:8003
#   Dashboard:   http://localhost:8501  (depends on API)
#   Prometheus:  http://localhost:9090
#   Grafana:     http://localhost:3000  (admin/admin)
#
# Do not run --profile ui together with the full stack (both bind 8501).
# Copy .env.example → .env for optional keys; never bake secrets into the image.

services:
  # Standalone Streamlit (profile "ui"). Does not start inference/collector.
  streamlit-ui:
    profiles: ["ui"]
    build: .
    command: >
      streamlit run src/opinion_trading/ui_dashboard.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
    environment:
      PYTHONPATH: /app/src
      SCORING_MODE: ${SCORING_MODE:-keyword}
      STREAMLIT_DASHBOARD_PASSWORD: ${STREAMLIT_DASHBOARD_PASSWORD:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  inference:
    build: .
    command: python -m opinion_trading.services.inference_app
    environment:
      PYTHONPATH: /app/src
      PORT: "8002"
      STORAGE_BACKEND: file
      LLM_CACHE_TTL_SECONDS: "86400"
      OPENCLAW_PROXY_KEYWORD_ONLY: "1"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  collector:
    build: .
    command: python -m opinion_trading.services.collector_app
    environment:
      PYTHONPATH: /app/src
      PORT: "8001"
      INFERENCE_URL: http://inference:8002
      OPENCLAW_URL: http://inference:8002
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      inference:
        condition: service_healthy

  compute:
    build: .
    command: python -m opinion_trading.services.compute_app
    environment:
      PYTHONPATH: /app/src
      PORT: "8003"
      INFERENCE_URL: http://inference:8002
      OPENCLAW_URL: http://inference:8002
    ports:
      - "8003:8003"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      - inference

  api:
    build: .
    command: python -m opinion_trading.services.api_app
    environment:
      PYTHONPATH: /app/src
      PORT: "8000"
      COLLECTOR_URL: http://collector:8001
      INFERENCE_URL: http://inference:8002
      COMPUTE_URL: http://compute:8003
      MEMORY_DIR: /app/data/memory
      REPORT_DIR: /app/data/reports
      API_CORS_ENABLED: ${API_CORS_ENABLED:-1}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      - collector
      - compute
      - inference

  web:
    profiles: ["web"]
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      DASHBOARD_PASSWORD: ${STREAMLIT_DASHBOARD_PASSWORD:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  scheduler:
    build: .
    command: python -m opinion_trading.services.scheduler
    environment:
      PYTHONPATH: /app/src
      TZ: Asia/Shanghai
      COLLECTOR_URL: http://collector:8001
      COMPUTE_URL: http://compute:8003
      PRICE_FILE: data/reports/price_history_template.csv
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      - api

  dashboard:
    build: .
    command: streamlit run src/opinion_trading/ui_dashboard.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    environment:
      PYTHONPATH: /app/src
      INFERENCE_URL: http://inference:8002
      OPENCLAW_URL: http://inference:8002
      SCORING_MODE: ${SCORING_MODE:-keyword}
      STREAMLIT_DASHBOARD_PASSWORD: ${STREAMLIT_DASHBOARD_PASSWORD:-}
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      - api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s


  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - inference
      - collector
      - compute

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/provisioning/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - prometheus
