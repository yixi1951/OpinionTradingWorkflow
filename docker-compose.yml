# OpinionTrading microservices stack
# Usage: docker compose up -d --build
# Web + API: http://localhost:8000
# Health: http://localhost:8000/health

services:
  inference:
    build: .
    command: python -m opinion_trading.services.inference_app
    environment:
      PYTHONPATH: /app/src
      PORT: "8002"
      STORAGE_BACKEND: file
      LLM_CACHE_TTL_SECONDS: "86400"
      OPENCLAW_PROXY_KEYWORD_ONLY: "1"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    expose:
      - "8002"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  collector:
    build: .
    command: python -m opinion_trading.services.collector_app
    environment:
      PYTHONPATH: /app/src
      PORT: "8001"
      INFERENCE_URL: http://inference:8002
      OPENCLAW_URL: http://inference:8002
    expose:
      - "8001"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      inference:
        condition: service_healthy

  compute:
    build: .
    command: python -m opinion_trading.services.compute_app
    environment:
      PYTHONPATH: /app/src
      PORT: "8003"
      INFERENCE_URL: http://inference:8002
      OPENCLAW_URL: http://inference:8002
    expose:
      - "8003"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      - inference

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opinion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD when using postgres profile}
      POSTGRES_DB: ${POSTGRES_DB:-opinion_auth}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/sql/auth_schema.postgres.sql:/docker-entrypoint-initdb.d/01_auth.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opinion} -d ${POSTGRES_DB:-opinion_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: python -m opinion_trading.services.api_app
    environment:
      PYTHONPATH: /app/src
      PORT: "8000"
      COLLECTOR_URL: http://collector:8001
      INFERENCE_URL: http://inference:8002
      COMPUTE_URL: http://compute:8003
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?Set APP_SESSION_SECRET in .env}
      APP_ENV: ${APP_ENV:-prod}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-sqlite:///data/auth.db}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - collector
      - compute
      - inference
    volumes:
      - ./data:/app/data

  scheduler:
    build: .
    command: python -m opinion_trading.services.scheduler
    environment:
      PYTHONPATH: /app/src
      TZ: Asia/Shanghai
      COLLECTOR_URL: http://collector:8001
      COMPUTE_URL: http://compute:8003
      PRICE_FILE: data/reports/price_history_template.csv
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    expose:
      - "9090"
    depends_on:
      - api
      - inference
      - collector
      - compute

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    expose:
      - "3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/provisioning/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
