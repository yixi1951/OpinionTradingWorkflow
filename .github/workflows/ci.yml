name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run linters and type checks
        run: |
          ruff check src tests openclaw_ws_proxy.py openclaw_stub.py run_pipeline.py
          black --check --diff src tests openclaw_ws_proxy.py openclaw_stub.py run_pipeline.py
          mypy src/opinion_trading || true
      - name: Run tests with coverage
        run: |
          pytest --cov=src/opinion_trading --cov-report=term-missing --cov-report=xml -v
      - name: Check coverage threshold
        if: always()
        run: |
          python -m coverage report --fail-under=44
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
