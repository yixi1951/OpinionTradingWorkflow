name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Branch protection (configure in GitHub Settings → Branches):
# Require this workflow status checks before merge to main:
#   - lint
#   - test (coverage gate)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff check
        run: ruff check src tests --select E,F,W --ignore E501

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov fastapi httpx uvicorn
      - name: Unit tests + coverage gate
        env:
          PYTHONPATH: src
          APP_ENV: staging
          KILL_SWITCH: "0"
          SCORING_MODE: keyword
        run: |
          python -m pytest tests/ -q --tb=short \
            --cov=opinion_trading \
            --cov-report=term-missing \
            --cov-fail-under=35

  fast-daily-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fast-daily replay (no crawl)
        env:
          PYTHONPATH: src
          APP_ENV: staging
          OPENCLAW_SKIP_ROW_SCORE: "1"
          SCORING_MODE: keyword
        run: |
          DATE="2026-06-17"
          mkdir -p data/raw data/memory data/reports
          if [ ! -f "data/raw/raw_posts_${DATE}.csv" ]; then
            cp tests/fixtures/raw_posts_smoke_min.csv "data/raw/raw_posts_${DATE}.csv"
          fi
          python -c "from opinion_trading.core.settings_patch import set_analysis_enabled; set_analysis_enabled('config/settings.yaml', False)"
          python -m opinion_trading.main --mode daily --date "${DATE}" --fast-daily
          test -f "data/memory/state.json"
