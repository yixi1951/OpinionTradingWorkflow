name: Thesis LLM/Jev rescore

# Live cascade rescore for thesis raw panels (Jev → DeepSeek → keyword).
# Requires repo secret DEEPSEEK_API_KEY; optional TYPESAFE_API_KEY / JEV_API_KEY.
on:
  workflow_dispatch:
    inputs:
      since:
        description: Inclusive start date YYYY-MM-DD
        type: string
        default: "2026-09-15"
      until:
        description: Inclusive end date YYYY-MM-DD
        type: string
        default: ""
      batch_size:
        description: Texts per DeepSeek request (Jev still 1 POST/text inside batch)
        type: string
        default: "8"
      max_rows_per_file:
        description: Cap pending rows per daily CSV (0 = all)
        type: string
        default: "0"
      commit_back:
        description: Commit rescored CSVs + thesis tables back to the branch
        type: boolean
        default: true
  push:
    branches:
      - cursor/thesis-proposal-1391
    paths:
      - ".github/workflows/thesis-llm-rescore.yml"
      - "scripts/rescore_raw_cascade.py"

concurrency:
  group: thesis-llm-rescore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      PYTHONPATH: src
      SCORING_MODE: ai
      SCORING_PROVIDER: jev,deepseek,keyword
      DEEPSEEK_ALLOW_LIVE: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe live scorers
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ] && [ -z "${TYPESAFE_API_KEY}" ] && [ -z "${JEV_API_KEY}" ]; then
            echo "No DEEPSEEK_API_KEY / TYPESAFE_API_KEY / JEV_API_KEY — cannot live-score."
            exit 1
          fi
          echo "::add-mask::${DEEPSEEK_API_KEY}"
          if [ -n "${TYPESAFE_API_KEY}" ]; then echo "::add-mask::${TYPESAFE_API_KEY}"; fi
          if [ -n "${JEV_API_KEY}" ]; then echo "::add-mask::${JEV_API_KEY}"; fi
          python - <<'PY'
          import os
          from opinion_trading.core.jev_client import jev_configured
          from opinion_trading.core.llm_failover import any_live_key
          print("jev_configured", jev_configured())
          print("any_live_key", any_live_key())
          print("provider", os.environ.get("SCORING_PROVIDER"))
          PY

      - name: Cascade rescore raw posts
        run: |
          SINCE="${{ github.event.inputs.since || '2026-09-15' }}"
          UNTIL="${{ github.event.inputs.until || '' }}"
          BATCH="${{ github.event.inputs.batch_size || '8' }}"
          MAXR="${{ github.event.inputs.max_rows_per_file || '0' }}"
          ARGS=(--since "$SINCE" --batch-size "$BATCH" --max-rows-per-file "$MAXR" --sleep 0.1)
          if [ -n "$UNTIL" ]; then ARGS+=(--until "$UNTIL"); fi
          python scripts/rescore_raw_cascade.py "${ARGS[@]}"

      - name: Refresh thesis panel + FM/Logit
        run: |
          python - <<'PY'
          from opinion_trading.core.sentiment_panel import build_sentiment_panel, load_raw_rows_from_dir
          from opinion_trading.core.thesis_models import run_thesis_models, save_thesis_model_reports
          from opinion_trading.core.evaluation import load_prices
          rows = load_raw_rows_from_dir("data/raw")
          panel = build_sentiment_panel(rows)
          panel.to_csv("data/reports/sentiment_panel.csv", index=False)
          prices = load_prices("data/reports/price_history_cache.csv")
          results = run_thesis_models(panel, prices)
          save_thesis_model_reports(results, "data/reports")
          src = panel  # noqa: silence
          import pandas as pd
          raw = pd.DataFrame(rows)
          if "score_source" in raw.columns:
              print("score_source counts:\n", raw["score_source"].value_counts().to_string())
          print("panel", panel.shape, "merged", results["panel_merged"].shape)
          print(results["fama_macbeth"].to_string(index=False))
          PY

      - name: Upload rescored artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-llm-rescore-${{ github.run_id }}
          path: |
            data/raw/raw_posts_*.csv
            data/reports/sentiment_panel.csv
            data/reports/thesis_*.csv
            data/reports/thesis_models.md
          if-no-files-found: warn

      - name: Commit rescored data back to branch
        if: ${{ github.event_name == 'push' || github.event.inputs.commit_back == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/raw_posts_*.csv \
            data/reports/sentiment_panel.csv \
            data/reports/thesis_fama_macbeth.csv \
            data/reports/thesis_logit.csv \
            data/reports/thesis_panel_merged.csv \
            data/reports/thesis_models.md || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Rescore thesis raw panel with Jev/DeepSeek cascade"
          git push
