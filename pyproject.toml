[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-opinion-trading"
version = "0.1.0"
description = "多平台舆情采集 · LLM 情感分析 · 实时选股 · 可解释投研仪表盘"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "yixi1951", email = "yixi1951@users.noreply.github.com" },
]
keywords = [
    "sentiment-analysis",
    "quantitative-trading",
    "chinese-stock",
    "deepseek",
    "openclaw",
    "streamlit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
urls = {
    "Homepage" = "https://github.com/yixi1951/OpinionTradingWorkflow",
    "Source" = "https://github.com/yixi1951/OpinionTradingWorkflow",
    "Bug Tracker" = "https://github.com/yixi1951/OpinionTradingWorkflow/issues",
    "Changelog" = "https://github.com/yixi1951/OpinionTradingWorkflow/blob/main/CHANGELOG.md",
}
dependencies = [
    "pydantic==2.11.3",
    "PyYAML==6.0.2",
    "pandas==2.2.3",
    "numpy==2.2.4",
    "matplotlib==3.10.1",
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "streamlit==1.38.0",
    "altair==5.5.0",
    "yfinance==0.2.54",
    "websockets>=10.0",
    "akshare==1.17.20",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-ignore = ["E203"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v --tb=short -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that make network calls",
]

[tool.coverage.run]
source = ["src/opinion_trading"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 44
sort = "Miss"

[tool.coverage.html]
directory = "coverage_html"
