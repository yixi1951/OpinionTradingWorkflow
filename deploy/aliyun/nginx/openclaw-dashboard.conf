# OpenClaw Streamlit dashboard — HTTP :80 reverse proxy
# Install: see docs/deploy-aliyun-nginx-auth.md

upstream openclaw_streamlit {
    server 127.0.0.1:8501;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 32m;

    # Basic auth (create with scripts/nginx_create_htpasswd.sh)
    auth_basic "OpenClaw AI Picks";
    auth_basic_user_file /etc/nginx/openclaw.htpasswd;

    location / {
        proxy_pass http://openclaw_streamlit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}