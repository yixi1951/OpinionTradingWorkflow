project:
  name: opinion-trading-openclaw
  timezone: Asia/Shanghai
  explanation_lang: zh
strategy:
  platforms:
  # UGC 舆情（落地采集）
  - guba
  - xueqiu
  - weibo
  - eastmoney
  - sina_finance
  - douyin
  # 权威信源扩展位（adapter 可渐进接入，不强制爬取）
  # 知乎：已提供 best-effort HTML adapter + stub fallback（见 tests/fixtures/zhihu_page.html）
  # - zhihu
  # B 站：best-effort 搜索页 HTML adapter + stub fallback（见 tests/fixtures/bilibili_page.html）
  # - bilibili
  # 小红书：best-effort 搜索页 HTML + stub fallback（见 tests/fixtures/xiaohongshu_page.html）
  # - xiaohongshu
  # 公众号：Sogou 列表页 HTML + stub fallback（真实 mp 页常被拦截；见 tests/fixtures/weixin_page.html）
  # - weixin
  # - cninfo
  # - broker_report
  platform_weights:
    guba: 1.4
    eastmoney: 1.3
    sina_finance: 1.15
    xueqiu: 1.2
    weibo: 0.95
    douyin: 1.05
    zhihu: 1.05
    bilibili: 1.0
    xiaohongshu: 0.95
    weixin: 1.1
    cninfo: 1.5
    broker_report: 1.45
  bearish_threshold: -0.6
  bullish_threshold: 0.7
  min_platforms_for_signal: 2
  reversal_min_delta: 0.1
  initial_cash: 100000
  position_size_ratio: 0.2
universe:
  # 聚焦覆盖：沪深300 流动子集（可用 --mode sync_universe 刷新）
  source: hs300
  max_symbols: 30
  symbols:
  - 600519.SH
  - 000858.SZ
  - 600036.SH
  - 601318.SH
  - 000001.SZ
  - 601166.SH
  - 600276.SH
  - 000333.SZ
  - 000651.SZ
  - 002415.SZ
  - 300750.SZ
  - 601012.SH
  - 600900.SH
  - 600030.SH
  - 000568.SZ
  - 600887.SH
  - 002304.SZ
storage:
  memory_dir: data/memory
  report_dir: data/reports
  raw_dir: data/raw
  # file | mysql | mongo | redis | multi （默认 file，DB 未配置时自动回退）
  backend: file
scoring:
  mode: ai
  # keyword = offline (CI default via SCORING_MODE=keyword).
  # ai / hybrid = DeepSeek live scoring when DEEPSEEK_API_KEY is set.
  # Keys never belong in this file — use env / gitignored .env (see .env.example).
  # Env overrides: DEEPSEEK_API_KEY, DEEPSEEK_BASE_URL, DEEPSEEK_MODEL, DEEPSEEK_TIMEOUT.
  # Live requested without a key: fallback to keyword unless DEEPSEEK_REQUIRE=1.
  provider: deepseek
  row_level_llm: true
  max_posts: 20
browser:
  enabled: true
  platforms:
  - xueqiu
  - weibo
  - douyin
ai_pipeline:
  screen_enabled: true
  score_enabled: true
  max_screen_batch: 12
  # Batch sentiment uses scoring.provider=deepseek when DEEPSEEK_API_KEY is set.
analysis:
  enabled: false
  sentiment_weight: 0.4
  technical_weight: 0.35
  fundamental_weight: 0.25
  min_analysts: 2
  bullish_threshold: 0.2
  bearish_threshold: -0.2
  max_kelly_fraction: 0.25
  min_confidence: 0.3
  technical_lookback_days: 365
quality:
  enabled: true
  max_fallback_rate: 0.35
  max_noise_rate: 0.10
  fail_confidence_multiplier: 0.55
  block_signals_on_severe_failure: true
  entity_match_rate_min: 0.70
platform_taxonomy:
  guba: forum
  eastmoney: portal
  sina_finance: news
  weibo: social
  xueqiu: investor_community
  douyin: short_video
  zhihu: qa_community
  bilibili: short_video
  xiaohongshu: social
  weixin: official_account
  cninfo: disclosure
  broker_report: research
scoring_fusion:
  hybrid_llm_weight: 0.72
  hybrid_keyword_weight: 0.28
  min_llm_confidence: 0.35
factor_backtest:
  horizons: [1, 3, 5]
  neutralize: true
  n_groups: 5
  benchmark: hs300
risk:
  max_daily_loss_pct: 0.05
  max_single_symbol_notional_pct: 0.25
  max_open_positions: 10
execution:
  mode: paper
  # paper | export | simulation | sandbox (sandbox = dry-run JSONL, no live orders)
  export_intents: true
  dry_run: true
  simulation_slippage_bps: 5.0
  fee_bps: 0.0
collection:
  # Round-robin / failover via ProxyRotator (HTTP crawl only). Also: PROXY_POOL=url1,url2
  # Captcha solvers and login-session farms are NOT implemented.
  proxy_urls: []
  # Zhihu / Bilibili / Xiaohongshu / Weixin adapters exist but stay opt-in
  # (uncomment under strategy.platforms). They are not on the default daily list.
sentiment_recency:
  enabled: true
  half_life_hours: 24.0
walk_forward:
  enabled_in_evaluate: true
  n_folds: 3
  train_days: 60
  test_days: 20
