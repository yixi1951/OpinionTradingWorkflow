project:
  name: opinion-trading-openclaw
  timezone: Asia/Shanghai

strategy:
  platforms:
    - guba
    - sina_finance
    - weibo
    - eastmoney
    - xueqiu
    - douyin
  platform_weights:
    guba: 1.40
    eastmoney: 1.30
    sina_finance: 1.15
    xueqiu: 1.10
    weibo: 0.95
    douyin: 1.05
  bearish_threshold: -0.6
  bullish_threshold: 0.7
  min_platforms_for_signal: 2
  reversal_min_delta: 0.1
  initial_cash: 100000
  position_size_ratio: 0.2

universe:
  symbols:
    - 600519.SH
    - 000001.SZ
    - 601318.SH
    - 600036.SH
    - 000858.SZ

storage:
  memory_dir: data/memory
  report_dir: data/reports
  raw_dir: data/raw

scoring:
  # 评分模式: keyword | openclaw | hybrid
  #   keyword: 仅关键词匹配（快速，离线可用）
  #   openclaw: 仅 OpenClaw LLM 评分（需网关连接）
  #   hybrid:   OpenClaw 优先，兜底关键词（默认推荐）
  mode: hybrid
  # 逐条 LLM 评分（默认关闭）:
  #   false: 仅在 collect_raw_posts 层面使用 AI 聚合评分，每帖仅关键词
  #   true:  每篇帖子都调用 LLM 评分（耗时约 20帖 × 2min/帖 ≈ 40min）
  row_level_llm: false
  # 单平台每次采集最大帖子数
  max_posts: 20
